
name: Build Mail Septian Support APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Test & Build Debug APK (MSFR_RATNA_2245)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mail-Septian-Support-MSFR_RATNA_2245-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
