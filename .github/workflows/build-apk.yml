name: Build Mail Septian Support APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Test & Build Signed Release APK (MSFR_RATNA_2245)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit & Robolectric Tests
        run: |
          gradle :app:testDebugUnitTest \
            --no-daemon \
            --no-configuration-cache

      - name: Prepare Release Keystore
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.STORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${RUNNER_TEMP}/release-key.jks"
            echo "KEYSTORE_PATH=${RUNNER_TEMP}/release-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Menggunakan keystore release dari GitHub Secrets."
          else
            RAND_PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -v \
              -keystore "${RUNNER_TEMP}/release-key.jks" \
              -storetype PKCS12 \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$RAND_PASS" \
              -keypass "$RAND_PASS" \
              -dname "CN=Mail Septian Support, OU=Security, O=Septian FR, L=Jakarta, ST=DKI Jakarta, C=ID"
            echo "::add-mask::$RAND_PASS"
            echo "KEYSTORE_PATH=${RUNNER_TEMP}/release-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${RAND_PASS}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${RAND_PASS}" >> "$GITHUB_ENV"
            echo "Keystore release otomatis dibuat pada runner CI (tanpa hardcoded secret di repo)."
          fi

      - name: Build Signed Release APK
        run: |
          gradle :app:assembleRelease \
            --no-daemon \
            --no-configuration-cache

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mail-Septian-Support-MSFR_RATNA_2245-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
